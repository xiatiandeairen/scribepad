<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizontal popup options</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --surface: #fff;
        --fg: #1f2328;
        --muted: #667085;
        --border: #d8dee4;
        --soft: #f6f8fa;
        --blue: #0969da;
        --green: #1f883d;
        --green-bg: #dafbe1;
        --red-bg: #ffebe9;
        --purple: #6f42c1;
        --shadow: 0 18px 46px rgba(31, 35, 40, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      }

      .page {
        padding: 22px;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .bar strong {
        font-size: 15px;
      }

      .switch {
        display: inline-flex;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .switch button {
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
      }

      .switch button.active {
        background: var(--fg);
        color: #fff;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(620px, 1fr));
        gap: 22px;
      }

      .name {
        display: flex;
        justify-content: space-between;
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 12px;
      }

      .stage {
        min-height: 360px;
        display: grid;
        place-items: center;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.78)),
          repeating-linear-gradient(0deg, transparent 0 31px, rgba(208, 215, 222, 0.4) 32px);
      }

      .popup {
        width: min(100%, 760px);
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
      }

      .badge {
        color: var(--muted);
        font-size: 12px;
      }

      .close {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 16px;
        cursor: pointer;
      }

      .compare {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 0;
      }

      .old,
      .next {
        min-height: 132px;
        max-height: 212px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        line-height: 1.6;
      }

      .old {
        color: var(--muted);
      }

      .next {
        color: var(--fg);
      }

      .editbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 12px;
      }

      input {
        min-width: 0;
        flex: 1;
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        color: var(--fg);
        padding: 0 10px;
        font: inherit;
        font-size: 13px;
      }

      button.action {
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        color: var(--fg);
        padding: 0 12px;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }

      button.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: #fff;
      }

      .v1 {
        border-radius: 8px;
      }
      .v1 .compare {
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .v1 .old,
      .v1 .next {
        padding: 12px;
        font-family: ui-monospace, 'SF Mono', monospace;
        font-size: 12px;
      }
      .v1 .old {
        background: var(--red-bg);
      }
      .v1 .next {
        background: var(--green-bg);
        border-left: 1px solid var(--border);
      }

      .v2 {
        border-radius: 12px;
      }
      .v2 .top {
        border-bottom: 1px solid var(--border);
      }
      .v2 .compare {
        gap: 14px;
        padding: 14px;
      }
      .v2 .old {
        max-height: 190px;
        padding: 0 0 0 12px;
        border-left: 3px solid var(--border);
        font-size: 12px;
      }
      .v2 .next {
        padding: 0;
        font-size: 15px;
        line-height: 1.72;
      }
      .v2 .editbar {
        border-top: 1px solid var(--border);
      }

      .v3 {
        border-radius: 10px;
      }
      .v3 .compare {
        gap: 10px;
        padding: 12px;
      }
      .v3 .old,
      .v3 .next {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 9px;
      }
      .v3 .old {
        background: var(--soft);
      }
      .v3 .next {
        background: #f0fff4;
        border-color: #aceebb;
      }

      .v4 {
        border-radius: 0;
      }
      .v4 .top,
      .v4 .editbar {
        background: #f6f8fa;
      }
      .v4 .compare {
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .v4 .old,
      .v4 .next {
        padding: 14px;
      }
      .v4 .next {
        border-left: 1px solid var(--border);
        box-shadow: inset 3px 0 0 var(--green);
      }

      .v5 {
        border-radius: 14px;
      }
      .v5 .compare {
        grid-template-columns: 0.76fr 1.24fr;
        gap: 12px;
        padding: 12px;
      }
      .v5 .old {
        padding: 10px;
        border-radius: 10px;
        background: var(--soft);
        font-size: 12px;
      }
      .v5 .next {
        padding: 12px;
        border-radius: 10px;
        background: #f7fbff;
        border: 1px solid #c8dff8;
        font-size: 14px;
      }

      .v6 {
        border-radius: 8px;
        background: #0d1117;
        color: #e6edf3;
        border-color: #30363d;
      }
      .v6 .badge,
      .v6 .close {
        color: #8b949e;
      }
      .v6 .compare {
        border-top: 1px solid #30363d;
        border-bottom: 1px solid #30363d;
      }
      .v6 .old,
      .v6 .next {
        padding: 12px;
        font-family: ui-monospace, 'SF Mono', monospace;
        font-size: 12px;
      }
      .v6 .old {
        background: #2d1117;
        color: #ffb3ad;
      }
      .v6 .next {
        background: #12251b;
        color: #aff5b4;
        border-left: 1px solid #30363d;
      }
      .v6 .editbar {
        background: #0d1117;
      }
      .v6 input,
      .v6 button.action {
        background: #161b22;
        color: #e6edf3;
        border-color: #30363d;
      }
      .v6 button.primary {
        background: #238636;
        border-color: #238636;
      }

      .v7 {
        border-radius: 10px;
      }
      .v7 .compare {
        grid-template-columns: 1fr 1.35fr;
        gap: 0;
        border-top: 1px solid var(--border);
      }
      .v7 .old,
      .v7 .next {
        padding: 13px;
      }
      .v7 .old {
        background: var(--soft);
      }
      .v7 .next {
        border-left: 1px solid var(--border);
        background: linear-gradient(#f4fff7, #fff);
      }
      .v7 .editbar {
        justify-content: flex-end;
      }
      .v7 input {
        max-width: 360px;
      }

      .v8 {
        border-radius: 12px;
      }
      .v8 .compare {
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--border);
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .v8 .old,
      .v8 .next {
        padding: 13px;
        background: var(--surface);
      }
      .v8 .next {
        color: var(--green);
      }

      .v9 {
        border-radius: 10px;
      }
      .v9 .top {
        padding-bottom: 0;
      }
      .v9 .compare {
        gap: 12px;
        padding: 12px;
      }
      .v9 .old,
      .v9 .next {
        padding: 12px;
        border-radius: 10px;
      }
      .v9 .old {
        border: 1px dashed var(--border);
      }
      .v9 .next {
        border: 1px solid #b7d9c2;
        background: linear-gradient(#f5fff8, #fff);
      }

      .v10 {
        border-radius: 8px;
      }
      .v10 .compare {
        grid-template-columns: 0.9fr 1.1fr;
        padding: 0 12px 12px;
        gap: 10px;
      }
      .v10 .old,
      .v10 .next {
        border-top: 3px solid var(--border);
        padding: 10px 0 0;
      }
      .v10 .next {
        border-top-color: var(--green);
      }

      .v11 {
        border-radius: 12px;
      }
      .v11 .compare {
        gap: 10px;
        padding: 12px;
      }
      .v11 .old,
      .v11 .next {
        padding: 12px;
        border-radius: 12px;
        background: #fff;
        box-shadow: inset 0 0 0 1px var(--border);
      }
      .v11 .next {
        box-shadow:
          inset 0 0 0 1px #aceebb,
          inset 0 -36px 0 rgba(218, 251, 225, 0.62);
      }

      .v12 {
        border-radius: 10px;
      }
      .v12 .compare {
        padding: 12px;
        gap: 10px;
      }
      .v12 .old,
      .v12 .next {
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
      }
      .v12 .old {
        opacity: 0.72;
      }
      .v12 .next {
        font-size: 15px;
        border-color: var(--green);
      }
      .v12 .editbar {
        padding-top: 0;
      }

      @media (max-width: 1320px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .compare {
          grid-template-columns: 1fr;
        }

        .next {
          border-left: 0 !important;
        }

        .editbar {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="bar">
        <strong>横向 popup 方案</strong>
        <div class="switch" aria-label="文本长度">
          <button class="active" data-mode="short">短文本</button>
          <button data-mode="long">长文本</button>
        </div>
      </div>

      <section class="grid" id="grid"></section>
    </main>

    <template id="popup-template">
      <article class="option">
        <p class="name"><span data-index></span><span data-name></span></p>
        <div class="stage">
          <div class="popup">
            <div class="top">
              <span class="badge">改写建议</span>
              <button class="close">×</button>
            </div>
            <div class="compare">
              <div class="old" data-old></div>
              <div class="next" data-new></div>
            </div>
            <div class="editbar">
              <input placeholder="继续修改..." />
              <button class="action">重写</button>
              <button class="action">取消</button>
              <button class="action primary">接受</button>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script>
      const variants = [
        'GitHub split',
        'Writing desk',
        'Soft cards',
        'Review table',
        'Weighted suggestion',
        'Dark diff',
        'Inspector',
        'Clean columns',
        'Dashed compare',
        'Top rail',
        'Highlight base',
        'Large suggestion',
      ]

      const samples = {
        short: {
          old: '核心诉求是会话能够即时撤销，且敏感载荷不暴露在客户端。',
          next: '核心目标是支持会话即时撤销，同时避免敏感载荷暴露在客户端。',
        },
        long: {
          old: '当前业务背景是：现有的 session token 直接存放在浏览器 cookie 中，而合规团队在 2026 年第二季度提出，需要将其重构为满足 SOC2 要求的会话管理方案。核心诉求是会话能够即时撤销，且敏感载荷不暴露在客户端。',
          next:
            '当前会话方案需要从直接暴露 token 的模式，调整为符合 SOC2 要求的服务端会话管理。新的方案应支持即时撤销、降低客户端敏感信息暴露，并为后续接入 SSO、审计追踪和权限收敛预留扩展空间。',
        },
      }

      const grid = document.querySelector('#grid')
      const template = document.querySelector('#popup-template')

      variants.forEach((name, i) => {
        const node = template.content.cloneNode(true)
        node.querySelector('[data-index]').textContent = `方案 ${i + 1}`
        node.querySelector('[data-name]').textContent = name
        node.querySelector('.popup').classList.add(`v${i + 1}`)
        grid.appendChild(node)
      })

      function render(mode) {
        document.querySelectorAll('[data-old]').forEach((node) => {
          node.textContent = samples[mode].old
        })
        document.querySelectorAll('[data-new]').forEach((node) => {
          node.textContent = samples[mode].next
        })
        document.querySelectorAll('.switch button').forEach((button) => {
          button.classList.toggle('active', button.dataset.mode === mode)
        })
      }

      document.querySelectorAll('.switch button').forEach((button) => {
        button.addEventListener('click', () => render(button.dataset.mode))
      })

      render('short')
    </script>
  </body>
</html>
