<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curated popup concepts</title>
    <style>
      :root {
        --ink: #1f2328;
        --muted: #667085;
        --line: #d8dee4;
        --paper: #fff;
        --wash: #f6f7f9;
        --blue: #0969da;
        --green: #1f883d;
        --green-soft: #dafbe1;
        --red-soft: #ffebe9;
        --shadow: 0 24px 70px rgba(15, 23, 42, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #eef1f5;
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      }

      .page {
        padding: 24px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .toolbar strong {
        font-size: 15px;
      }

      .toggle {
        display: inline-flex;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
      }

      .toggle button {
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        padding: 6px 11px;
        font-size: 13px;
        cursor: pointer;
      }

      .toggle button.active {
        background: #111827;
        color: #fff;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(560px, 1fr));
        gap: 28px;
      }

      .concept-name {
        display: flex;
        justify-content: space-between;
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .stage {
        min-height: 420px;
        display: grid;
        place-items: center;
        padding: 28px;
        border: 1px solid #d2d8e2;
        border-radius: 16px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0.76)),
          repeating-linear-gradient(0deg, transparent 0 31px, rgba(148, 163, 184, 0.26) 32px);
      }

      .popup {
        width: min(100%, 720px);
        background: var(--paper);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .old,
      .new {
        white-space: pre-wrap;
        word-break: break-word;
        overflow: auto;
      }

      .old {
        color: var(--muted);
      }

      .new {
        color: var(--ink);
      }

      input {
        min-width: 0;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        outline: none;
      }

      button {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }

      button.primary {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }

      .x {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 0;
        font-size: 18px;
      }

      /* 1. Editorial Sheet */
      .editorial {
        max-width: 620px;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        background: #fff;
      }

      .editorial .top {
        display: flex;
        justify-content: space-between;
        padding: 16px 18px 8px;
      }

      .editorial .new {
        max-height: 210px;
        padding: 0 34px 8px;
        font-size: 18px;
        line-height: 1.78;
      }

      .editorial .old {
        max-height: 58px;
        margin: 0 34px 16px;
        padding-left: 12px;
        border-left: 3px solid #d1d5db;
        font-size: 12px;
        line-height: 1.5;
      }

      .editorial .bar {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #eef0f3;
        background: #fafafa;
      }

      .editorial input,
      .editorial button {
        height: 34px;
        border-radius: 9px;
        padding: 0 12px;
      }

      /* 2. Studio Compare */
      .studio {
        border-radius: 14px;
        background: #111827;
        color: #f9fafb;
      }

      .studio .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
      }

      .studio .x {
        color: #9ca3af;
      }

      .studio .body {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 1px;
        background: #374151;
      }

      .studio .old,
      .studio .new {
        max-height: 218px;
        min-height: 154px;
        padding: 14px;
        font-size: 13px;
        line-height: 1.65;
      }

      .studio .old {
        background: #1f2937;
        color: #9ca3af;
      }

      .studio .new {
        background: #10251b;
        color: #d1fae5;
      }

      .studio .bar {
        display: flex;
        gap: 8px;
        padding: 12px;
      }

      .studio input,
      .studio button {
        height: 34px;
        border-radius: 8px;
        border-color: #374151;
        background: #0f172a;
        color: #f9fafb;
        padding: 0 12px;
      }

      .studio input {
        flex: 1;
      }

      .studio button.primary {
        background: #22c55e;
        border-color: #22c55e;
        color: #052e16;
      }

      /* 3. Review Rail */
      .rail {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        border-radius: 12px;
        border: 1px solid #cfd8e3;
        background: #fff;
      }

      .rail .side {
        display: grid;
        place-items: start center;
        padding-top: 14px;
        background: #f8fafc;
        border-right: 1px solid #e2e8f0;
        color: #475569;
        font-size: 12px;
        writing-mode: vertical-rl;
        letter-spacing: 0.08em;
      }

      .rail .main {
        min-width: 0;
      }

      .rail .top {
        display: flex;
        justify-content: flex-end;
        padding: 10px 12px 0;
      }

      .rail .new {
        max-height: 190px;
        min-height: 136px;
        margin: 0 16px 10px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #ecfdf3;
        border: 1px solid #bbf7d0;
        font-size: 14px;
        line-height: 1.66;
      }

      .rail .old {
        max-height: 56px;
        margin: 0 16px 12px;
        font-size: 12px;
        line-height: 1.5;
      }

      .rail .bar {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid #e2e8f0;
      }

      .rail input,
      .rail button {
        height: 32px;
        border-radius: 999px;
        padding: 0 12px;
      }

      /* 4. Floating Pair */
      .floating {
        width: min(100%, 700px);
        background: transparent;
        box-shadow: none;
        display: grid;
        grid-template-columns: 0.78fr 1fr;
        gap: 10px;
      }

      .floating .panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        box-shadow: var(--shadow);
      }

      .floating .old-panel {
        border-radius: 14px;
        align-self: start;
      }

      .floating .new-panel {
        border-radius: 18px;
      }

      .floating .top {
        display: flex;
        justify-content: space-between;
        padding: 10px 12px;
      }

      .floating .old {
        max-height: 210px;
        padding: 0 12px 12px;
        font-size: 12px;
        line-height: 1.55;
      }

      .floating .new {
        max-height: 240px;
        min-height: 170px;
        padding: 0 16px 12px;
        font-size: 15px;
        line-height: 1.72;
      }

      .floating .bar {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #eef0f3;
      }

      .floating input,
      .floating button {
        height: 32px;
        border-radius: 8px;
        padding: 0 11px;
      }

      /* 5. Dense Inspector */
      .inspector {
        border-radius: 8px;
        border: 1px solid #cfd8e3;
      }

      .inspector .top {
        display: flex;
        justify-content: space-between;
        padding: 9px 11px;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
      }

      .inspector .body {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .inspector .old,
      .inspector .new {
        min-height: 170px;
        max-height: 260px;
        padding: 12px;
        font-family: ui-monospace, 'SF Mono', monospace;
        font-size: 12px;
        line-height: 1.58;
      }

      .inspector .old {
        background: var(--red-soft);
      }

      .inspector .new {
        background: var(--green-soft);
        border-left: 1px solid #cfd8e3;
      }

      .inspector .bar {
        display: flex;
        gap: 8px;
        padding: 10px;
        border-top: 1px solid #cfd8e3;
      }

      .inspector input {
        flex: 1;
      }

      .inspector input,
      .inspector button {
        height: 30px;
        border-radius: 6px;
        padding: 0 10px;
      }

      /* 6. Calm Card */
      .calm {
        border: 0;
        border-radius: 20px;
        background: #fff;
      }

      .calm .top {
        display: flex;
        justify-content: space-between;
        padding: 16px 18px 6px;
      }

      .calm .body {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 14px;
        padding: 10px 18px 14px;
      }

      .calm .old {
        max-height: 180px;
        padding: 12px;
        border-radius: 14px;
        background: #f8fafc;
        font-size: 12px;
        line-height: 1.55;
      }

      .calm .new {
        max-height: 220px;
        min-height: 150px;
        padding: 14px 16px;
        border-radius: 14px;
        background: #f6fff9;
        border: 1px solid #bbf7d0;
        font-size: 15px;
        line-height: 1.72;
      }

      .calm .bar {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 8px;
        padding: 0 18px 18px;
      }

      .calm input,
      .calm button {
        height: 34px;
        border-radius: 10px;
        padding: 0 12px;
      }

      @media (max-width: 1320px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .body,
        .compare,
        .floating,
        .calm .body {
          grid-template-columns: 1fr !important;
        }

        .bar,
        .editorial .bar,
        .rail .bar,
        .floating .bar,
        .calm .bar {
          grid-template-columns: 1fr;
        }

        .editbar,
        .studio .bar,
        .inspector .bar {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="toolbar">
        <strong>重新设计的 popup 概念</strong>
        <div class="toggle" aria-label="文本长度">
          <button class="active" data-mode="short">短文本</button>
          <button data-mode="long">长文本</button>
        </div>
      </div>

      <section class="grid">
        <article>
          <p class="concept-name"><span>方案 1</span><span>Editorial Sheet</span></p>
          <div class="stage">
            <div class="popup editorial">
              <div class="top">
                <span></span>
                <button class="x">×</button>
              </div>
              <div class="new" data-new></div>
              <div class="old" data-old></div>
              <div class="bar">
                <input placeholder="继续修改..." />
                <button>重写</button>
                <button>取消</button>
                <button class="primary">接受</button>
              </div>
            </div>
          </div>
        </article>

        <article>
          <p class="concept-name"><span>方案 2</span><span>Studio Compare</span></p>
          <div class="stage">
            <div class="popup studio">
              <div class="top">
                <span>Rewrite</span>
                <button class="x">×</button>
              </div>
              <div class="body">
                <div class="old" data-old></div>
                <div class="new" data-new></div>
              </div>
              <div class="bar">
                <input placeholder="继续修改..." />
                <button>重写</button>
                <button>取消</button>
                <button class="primary">接受</button>
              </div>
            </div>
          </div>
        </article>

        <article>
          <p class="concept-name"><span>方案 3</span><span>Review Rail</span></p>
          <div class="stage">
            <div class="popup rail">
              <div class="side">REVIEW</div>
              <div class="main">
                <div class="top"><button class="x">×</button></div>
                <div class="new" data-new></div>
                <div class="old" data-old></div>
                <div class="bar">
                  <input placeholder="继续修改..." />
                  <button>重写</button>
                  <button>取消</button>
                  <button class="primary">接受</button>
                </div>
              </div>
            </div>
          </div>
        </article>

        <article>
          <p class="concept-name"><span>方案 4</span><span>Floating Pair</span></p>
          <div class="stage">
            <div class="popup floating">
              <div class="panel old-panel">
                <div class="top"><span>当前</span></div>
                <div class="old" data-old></div>
              </div>
              <div class="panel new-panel">
                <div class="top">
                  <span>建议</span>
                  <button class="x">×</button>
                </div>
                <div class="new" data-new></div>
                <div class="bar">
                  <input placeholder="继续修改..." />
                  <button>重写</button>
                  <button>取消</button>
                  <button class="primary">接受</button>
                </div>
              </div>
            </div>
          </div>
        </article>

        <article>
          <p class="concept-name"><span>方案 5</span><span>Dense Inspector</span></p>
          <div class="stage">
            <div class="popup inspector">
              <div class="top">
                <span>Compare</span>
                <button class="x">×</button>
              </div>
              <div class="body">
                <div class="old" data-old></div>
                <div class="new" data-new></div>
              </div>
              <div class="bar">
                <input placeholder="继续修改..." />
                <button>重写</button>
                <button>取消</button>
                <button class="primary">接受</button>
              </div>
            </div>
          </div>
        </article>

        <article>
          <p class="concept-name"><span>方案 6</span><span>Calm Card</span></p>
          <div class="stage">
            <div class="popup calm">
              <div class="top">
                <span></span>
                <button class="x">×</button>
              </div>
              <div class="body">
                <div class="old" data-old></div>
                <div class="new" data-new></div>
              </div>
              <div class="bar">
                <input placeholder="继续修改..." />
                <button>重写</button>
                <button>取消</button>
                <button class="primary">接受</button>
              </div>
            </div>
          </div>
        </article>
      </section>
    </main>

    <script>
      const samples = {
        short: {
          old: '核心诉求是会话能够即时撤销，且敏感载荷不暴露在客户端。',
          next: '核心目标是支持会话即时撤销，同时避免敏感载荷暴露在客户端。',
        },
        long: {
          old: '当前业务背景是：现有的 session token 直接存放在浏览器 cookie 中，而合规团队在 2026 年第二季度提出，需要将其重构为满足 SOC2 要求的会话管理方案。核心诉求是会话能够即时撤销，且敏感载荷不暴露在客户端。',
          next:
            '当前会话方案需要从直接暴露 token 的模式，调整为符合 SOC2 要求的服务端会话管理。新的方案应支持即时撤销、降低客户端敏感信息暴露，并为后续接入 SSO、审计追踪和权限收敛预留扩展空间。',
        },
      }

      function render(mode) {
        document.querySelectorAll('[data-old]').forEach((node) => {
          node.textContent = samples[mode].old
        })
        document.querySelectorAll('[data-new]').forEach((node) => {
          node.textContent = samples[mode].next
        })
        document.querySelectorAll('.toggle button').forEach((button) => {
          button.classList.toggle('active', button.dataset.mode === mode)
        })
      }

      document.querySelectorAll('.toggle button').forEach((button) => {
        button.addEventListener('click', () => render(button.dataset.mode))
      })

      render('short')
    </script>
  </body>
</html>
