<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>16 popup options</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #fff;
        --fg: #1f2328;
        --muted: #6e7781;
        --border: #d8dee4;
        --soft: #f6f8fa;
        --blue: #0969da;
        --green: #1f883d;
        --green-bg: #dafbe1;
        --red-bg: #ffebe9;
        --shadow: 0 18px 46px rgba(31, 35, 40, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      }

      .page {
        padding: 22px;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .bar strong {
        font-size: 15px;
      }

      .switch {
        display: inline-flex;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .switch button {
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
      }

      .switch button.active {
        background: var(--fg);
        color: #fff;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(300px, 1fr));
        gap: 18px;
      }

      .option {
        min-width: 0;
      }

      .name {
        display: flex;
        justify-content: space-between;
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 12px;
      }

      .stage {
        min-height: 350px;
        display: grid;
        place-items: center;
        padding: 18px 14px 34px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.74)),
          repeating-linear-gradient(0deg, transparent 0 31px, rgba(208, 215, 222, 0.42) 32px);
      }

      .popup {
        position: relative;
        width: min(100%, 390px);
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        overflow: visible;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 10px 6px;
      }

      .badge {
        color: var(--muted);
        font-size: 11px;
      }

      .close {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 15px;
        cursor: pointer;
      }

      .content {
        display: grid;
        gap: 8px;
        padding: 0 10px 10px;
      }

      .suggestion,
      .original {
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .suggestion {
        color: var(--fg);
      }

      .original {
        color: var(--muted);
      }

      .edit {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      textarea {
        width: 100%;
        height: 28px;
        min-height: 28px;
        max-height: 28px;
        resize: none;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        color: var(--fg);
        padding: 4px 8px;
        font: inherit;
        font-size: 12px;
        line-height: 18px;
      }

      .icon {
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
      }

      .accept {
        position: absolute;
        right: 10px;
        bottom: -34px;
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }

      .row {
        display: grid;
        gap: 6px;
      }

      .v1 {
        border-radius: 10px;
      }
      .v1 .suggestion {
        min-height: 112px;
        max-height: 162px;
        padding: 11px;
        border: 1px solid #aceebb;
        border-radius: 8px;
        background: var(--green-bg);
        font-size: 14px;
        line-height: 1.58;
      }
      .v1 .original {
        max-height: 46px;
        padding: 7px 9px;
        border-radius: 7px;
        background: var(--soft);
        font-size: 12px;
      }

      .v2 {
        border-radius: 12px;
      }
      .v2 .suggestion {
        min-height: 150px;
        max-height: 205px;
        padding: 2px 2px 5px;
        font-size: 15px;
        line-height: 1.72;
      }
      .v2 .original {
        max-height: 44px;
        padding-left: 9px;
        border-left: 3px solid var(--border);
        font-size: 12px;
      }

      .v3 {
        border-radius: 8px;
      }
      .v3 .original,
      .v3 .suggestion {
        padding: 9px 10px;
        border: 1px solid var(--border);
        font-family: ui-monospace, 'SF Mono', monospace;
        font-size: 12px;
        line-height: 1.55;
      }
      .v3 .original {
        max-height: 58px;
        border-radius: 7px 7px 0 0;
        background: var(--red-bg);
      }
      .v3 .suggestion {
        min-height: 112px;
        max-height: 170px;
        margin-top: -1px;
        border-radius: 0 0 7px 7px;
        background: var(--green-bg);
      }

      .v4 {
        border-radius: 10px;
      }
      .v4 .suggestion {
        min-height: 126px;
        max-height: 190px;
        padding: 13px;
        border-radius: 9px;
        background: #f0fff4;
        border: 1px solid #aceebb;
        font-size: 14px;
        line-height: 1.66;
      }
      .v4 .original {
        display: none;
      }
      .v4 .edit {
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--soft);
      }

      .v5 {
        border-radius: 8px;
      }
      .v5 .suggestion {
        min-height: 130px;
        max-height: 185px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #fff;
        border: 1px solid var(--border);
        box-shadow: inset 3px 0 0 var(--green);
        font-size: 14px;
        line-height: 1.65;
      }
      .v5 .original {
        max-height: 42px;
        font-size: 12px;
      }

      .v6 {
        border-radius: 14px;
      }
      .v6 .suggestion {
        min-height: 122px;
        max-height: 176px;
        padding: 12px;
        border-radius: 12px;
        background: #f7fbff;
        border: 1px solid #c8dff8;
        font-size: 14px;
        line-height: 1.6;
      }
      .v6 .original {
        max-height: 44px;
        padding: 7px 9px;
        border-radius: 10px;
        background: var(--soft);
        font-size: 12px;
      }

      .v7 {
        border-radius: 8px;
      }
      .v7 .content {
        gap: 0;
      }
      .v7 .suggestion {
        min-height: 138px;
        max-height: 196px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px 8px 0 0;
        background: var(--surface);
        font-size: 14px;
        line-height: 1.64;
      }
      .v7 .original {
        max-height: 46px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-top: 0;
        border-radius: 0 0 8px 8px;
        background: var(--soft);
        font-size: 12px;
      }
      .v7 .edit {
        margin-top: 8px;
      }

      .v8 {
        border-radius: 9px;
      }
      .v8 .suggestion {
        min-height: 118px;
        max-height: 178px;
        padding: 11px 12px;
        border-radius: 8px;
        background: #fcfff4;
        border: 1px solid #d8e7a7;
        font-size: 14px;
        line-height: 1.62;
      }
      .v8 .original {
        max-height: 42px;
        padding: 6px 8px;
        border-radius: 7px;
        background: #fbfbfb;
        font-size: 12px;
      }

      .v9 {
        border-radius: 10px;
      }
      .v9 .suggestion {
        min-height: 126px;
        max-height: 180px;
        padding: 12px 13px;
        border-radius: 9px;
        background: #f8fafc;
        border: 1px solid #d0d7de;
        font-size: 14px;
        line-height: 1.62;
      }
      .v9 .original {
        max-height: 42px;
        font-size: 12px;
      }
      .v9 .accept {
        right: 50%;
        transform: translateX(50%);
      }

      .v10 {
        border-radius: 8px;
      }
      .v10 .suggestion {
        min-height: 136px;
        max-height: 192px;
        padding: 12px;
        background: #0d1117;
        color: #e6edf3;
        border-radius: 7px;
        font-size: 13px;
        line-height: 1.62;
      }
      .v10 .original {
        max-height: 42px;
        font-size: 12px;
      }

      .v11 {
        border-radius: 9px;
      }
      .v11 .suggestion {
        min-height: 120px;
        max-height: 178px;
        padding: 12px;
        border: 1px solid #b7d9c2;
        border-radius: 9px;
        background: linear-gradient(#f5fff8, #fff);
        font-size: 14px;
        line-height: 1.64;
      }
      .v11 .original {
        max-height: 40px;
        font-size: 12px;
      }

      .v12 {
        border-radius: 10px;
      }
      .v12 .suggestion {
        min-height: 130px;
        max-height: 190px;
        padding: 13px 14px;
        border-radius: 9px;
        background: #fff;
        border: 1px solid var(--border);
        font-size: 14px;
        line-height: 1.66;
      }
      .v12 .original {
        max-height: 0;
        opacity: 0;
      }

      .v13 {
        border-radius: 7px;
      }
      .v13 .suggestion {
        min-height: 118px;
        max-height: 176px;
        padding: 10px 12px;
        border: 1px dashed #98cfa7;
        border-radius: 7px;
        background: #fbfffc;
        font-size: 14px;
        line-height: 1.6;
      }
      .v13 .original {
        max-height: 46px;
        padding: 7px 9px;
        border-radius: 7px;
        background: var(--soft);
        font-size: 12px;
      }

      .v14 {
        border-radius: 12px;
      }
      .v14 .suggestion {
        min-height: 138px;
        max-height: 200px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #f5f7fb;
        border: 1px solid #d7dce5;
        font-size: 14px;
        line-height: 1.68;
      }
      .v14 .original {
        display: none;
      }

      .v15 {
        border-radius: 8px;
      }
      .v15 .suggestion {
        min-height: 126px;
        max-height: 184px;
        padding: 11px 12px;
        border-radius: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: inset 0 -32px 0 rgba(218, 251, 225, 0.58);
        font-size: 14px;
        line-height: 1.62;
      }
      .v15 .original {
        max-height: 42px;
        font-size: 12px;
      }

      .v16 {
        border-radius: 999px 18px 18px 18px;
      }
      .v16 .suggestion {
        min-height: 118px;
        max-height: 172px;
        padding: 12px 14px;
        border-radius: 16px;
        background: #f3fff6;
        border: 1px solid #b7e3c1;
        font-size: 14px;
        line-height: 1.64;
      }
      .v16 .original {
        max-height: 42px;
        font-size: 12px;
      }

      @media (max-width: 1360px) {
        .grid {
          grid-template-columns: repeat(3, minmax(300px, 1fr));
        }
      }

      @media (max-width: 1040px) {
        .grid {
          grid-template-columns: repeat(2, minmax(300px, 1fr));
        }
      }

      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="bar">
        <strong>16 个 popup 方向</strong>
        <div class="switch" aria-label="文本长度">
          <button class="active" data-mode="short">短文本</button>
          <button data-mode="long">长文本</button>
        </div>
      </div>

      <section class="grid" id="grid"></section>
    </main>

    <template id="popup-template">
      <article class="option">
        <p class="name"><span data-index></span><span data-name></span></p>
        <div class="stage">
          <div class="popup">
            <div class="top">
              <span class="badge">改写建议</span>
              <button class="close">×</button>
            </div>
            <div class="content">
              <div class="row">
                <div class="suggestion" data-new></div>
                <div class="original" data-old></div>
              </div>
              <div class="edit">
                <textarea rows="1" placeholder="继续修改..."></textarea>
                <button class="icon" title="重写" aria-label="重写">↻</button>
              </div>
            </div>
            <button class="icon accept" title="接受" aria-label="接受">✓</button>
          </div>
        </div>
      </article>
    </template>

    <script>
      const variants = [
        'Linear compact',
        'Writing sheet',
        'PR patch',
        'Command bar',
        'Left rail',
        'Soft blue',
        'Stacked card',
        'Warm note',
        'Center accept',
        'Dark preview',
        'Gradient soft',
        'Suggestion only',
        'Dashed review',
        'Quiet panel',
        'Highlight base',
        'Rounded bubble',
      ]

      const samples = {
        short: {
          old: '核心诉求是会话能够即时撤销，且敏感载荷不暴露在客户端。',
          next: '核心目标是支持会话即时撤销，同时避免敏感载荷暴露在客户端。',
        },
        long: {
          old: '当前业务背景是：现有的 session token 直接存放在浏览器 cookie 中，而合规团队在 2026 年第二季度提出，需要将其重构为满足 SOC2 要求的会话管理方案。核心诉求是会话能够即时撤销，且敏感载荷不暴露在客户端。',
          next:
            '当前会话方案需要从直接暴露 token 的模式，调整为符合 SOC2 要求的服务端会话管理。新的方案应支持即时撤销、降低客户端敏感信息暴露，并为后续接入 SSO、审计追踪和权限收敛预留扩展空间。',
        },
      }

      const grid = document.querySelector('#grid')
      const template = document.querySelector('#popup-template')

      variants.forEach((name, i) => {
        const node = template.content.cloneNode(true)
        node.querySelector('[data-index]').textContent = `方案 ${i + 1}`
        node.querySelector('[data-name]').textContent = name
        node.querySelector('.popup').classList.add(`v${i + 1}`)
        grid.appendChild(node)
      })

      function render(mode) {
        document.querySelectorAll('[data-old]').forEach((node) => {
          node.textContent = samples[mode].old
        })
        document.querySelectorAll('[data-new]').forEach((node) => {
          node.textContent = samples[mode].next
        })
        document.querySelectorAll('.switch button').forEach((button) => {
          button.classList.toggle('active', button.dataset.mode === mode)
        })
      }

      document.querySelectorAll('.switch button').forEach((button) => {
        button.addEventListener('click', () => render(button.dataset.mode))
      })

      render('short')
    </script>
  </body>
</html>
